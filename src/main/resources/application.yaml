spring:
  application:
    name: cp5

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cp5}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}

banco-tranquilo:
  base-url: ${BANK_BASE_URL:http://localhost:8081}
  api-key: ${BANK_API_KEY:demo-local}
  mail-from: ${MAIL_FROM:mercado@localhost}
