<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Mercado Express</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-auth">

<header>
    <h1>Mercado Express</h1>
</header>

<main>
    <h2>Entrar na sua conta</h2>

    <p role="alert" th:if="${param.error != null}">
        E-mail ou senha inválidos.
    </p>

    <p role="status" th:if="${param.cadastro != null}">
        Cadastro realizado com sucesso! Entre com seu e-mail e senha.
    </p>

    <p role="status" th:if="${param.logout != null}">
        Você saiu da sua conta.
    </p>

    <form th:action="@{/login}" method="post">

        <div>
            <label for="email">E-mail:</label>
            <input type="email"
                   id="email"
                   name="email"
                   autocomplete="username"
                   required>
        </div>

        <div>
            <label for="senha">Senha:</label>
            <input type="password"
                   id="senha"
                   name="senha"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit">Entrar</button>
    </form>

    <p>
        Ainda não tem uma conta?
        <a th:href="@{/cadastro}">Cadastre-se</a>
    </p>
</main>

</body>
</html>
