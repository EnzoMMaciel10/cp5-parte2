services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cp5
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cp5-local
    ports:
      - "5433:5432"
    volumes:
      - cp5_postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  cp5_postgres:
